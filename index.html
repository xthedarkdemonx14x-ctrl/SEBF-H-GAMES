<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SEBF.H.GAMES</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #050510;
      color: white;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.45;
      z-index: -1;
      animation: mover 7s infinite alternate ease-in-out;
    }

    body::before {
      background: #7c00ff;
      top: -120px;
      left: -120px;
    }

    body::after {
      background: #00eaff;
      bottom: -120px;
      right: -120px;
      animation-delay: 2s;
    }

    @keyframes mover {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(100px, 80px);
      }
    }

    /* MENÚ */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: rgba(5, 5, 16, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 234, 255, 0.2);
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 10px;
      transition: 0.3s;
      font-size: 14px;
    }

    nav a:hover {
      background: #00eaff;
      color: #050510;
      box-shadow: 0 0 18px #00eaff;
    }

    /* INICIO */

    #inicio {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .logo {
      font-size: clamp(35px, 10vw, 60px);
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow:
        0 0 10px #00eaff,
        0 0 25px #7c00ff,
        0 0 50px #7c00ff;
      animation: aparecer 1s ease;
    }

    .frase {
      margin-top: 15px;
      color: #aaa;
      font-size: 17px;
    }

    .boton-principal {
      margin-top: 30px;
      padding: 14px 30px;
      border: 1px solid #00eaff;
      border-radius: 12px;
      background: rgba(0, 234, 255, 0.08);
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .boton-principal:hover {
      background: #00eaff;
      color: #050510;
      box-shadow: 0 0 25px #00eaff;
    }

    /* SECCIONES */

    section {
      max-width: 950px;
      margin: auto;
      padding: 70px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 35px;
      color: #00eaff;
      text-shadow: 0 0 12px #00eaff;
      font-size: 30px;
    }

    /* TARJETAS */

    .juegos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .juego {
      display: block;
      padding: 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,234,255,0.25);
      backdrop-filter: blur(10px);
      transition: 0.25s ease;
      animation: aparecer 1s ease;
      color: white;
      text-decoration: none;
    }

    .juego:hover {
      transform: translateY(-7px) scale(1.02);
      box-shadow:
        0 0 15px #00eaff,
        0 0 35px rgba(124,0,255,0.5);
    }

    .juego:active {
      transform: scale(0.97);
      box-shadow:
        0 0 20px #00eaff,
        0 0 40px #7c00ff;
    }

    .imagen-juego {
      width: 100%;
      height: 200px;
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .etiqueta {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: rgba(0,234,255,0.1);
      border: 1px solid #00eaff;
      color: #00eaff;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .juego h3 {
      margin-bottom: 12px;
      font-size: 24px;
    }

    .juego p {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .descargar {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #00eaff;
      border-radius: 10px;
      background: rgba(0,234,255,0.08);
      color: white;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .descargar:hover {
      background: #00eaff;
      color: #050510;
      box-shadow: 0 0 20px #00eaff;
    }

    /* PROYECTOS */

    .proyectos {
      display: grid;
      gap: 20px;
    }

    .proyecto {
      padding: 22px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(124,0,255,0.35);
      transition: 0.3s;
    }

    .proyecto:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 25px rgba(124,0,255,0.25);
    }

    .proyecto h3 {
      margin-bottom: 8px;
    }

    .proyecto p {
      color: #aaa;
      line-height: 1.5;
    }

    /* SOBRE MÍ */

    .sobre {
      max-width: 750px;
      margin: auto;
      text-align: center;
      color: #aaa;
      line-height: 1.8;
      font-size: 16px;
    }

    .frase-final {
      margin-top: 30px;
      color: #00eaff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 0 12px #00eaff;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #666;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
